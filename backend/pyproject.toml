[project]
name = "chessmaster-backend"
version = "0.1.0"
description = "Chess game analysis backend"
requires-python = ">=3.11"
# Exact pins from production image (2026-07-20).
# These versions are tested and known-working. Bump deliberately and test, do not float.
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    # "python-chess" on PyPI is a legacy shim (1.999); the real package is "chess".
    "chess==1.11.2",
    "httpx==0.28.1",
    "anthropic==0.117.0",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "psycopg[binary]==3.3.4",
    "fastapi-users[sqlalchemy]==15.0.5",
    "resend==2.34.0",
    "cryptography==49.0.0",
    "razorpay==2.0.1",
    # Password hashing libraries: pinned deliberately because they are transitives
    # of fastapi-users[sqlalchemy] and directly affect password verification.
    # Unpinned upgrades to these break existing user logins on rebuild.
    # Verify existing users can still log in before changing these versions.
    "bcrypt==5.0.0",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==25.1.0",
]

[project.optional-dependencies]
# Dev deps intentionally left unpinned — they never ship to production.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
