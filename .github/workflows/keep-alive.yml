name: keep-alive

# The API runs on Render's free plan, which spins the service down after ~15
# minutes of inactivity — the next visitor then hits a ~40s cold start (a 502
# at the proxy). This workflow pings the health endpoint every ~10 minutes so
# the backend never goes to sleep. (For a fully reliable fix, upgrade the API
# off the free plan.)

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub cron is best-effort)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          URL="https://chessmaster-api-sokc.onrender.com/api/health"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::API health did not return 200 after retries"
          exit 1
